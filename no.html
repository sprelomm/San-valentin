<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Respuesta incorrecta 😤</title>

<style>
body{
  background:#ffe6e6;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  font-family:Arial;
  text-align:center;
  overflow:hidden;
}

#noBtn{
  position:absolute;
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#999;
  cursor:pointer;
}

#siBtn{
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:10px;
  background:#ff4d88;
  color:white;
  cursor:pointer;
}
</style>
</head>

<body>

<div>
  <h1>Esa no era la respuesta correcta 😤💔</h1>
  <p>Intenta presionar "No"... si puedes 😈</p>

  <br><br>

  <button id="siBtn" onclick="location.href='si.html'">Bueno… sí 💘</button>
  <button id="noBtn">No 😢</button>

  <div id="snoopy" style="font-size:80px; margin-top:20px; display:none;">
    🐶💢
  </div>
</div>

<script>
const noBtn = document.getElementById("noBtn");
const snoopy = document.getElementById("snoopy");

noBtn.addEventListener("mouseover", () => {
  const x = Math.random() * (window.innerWidth - 100);
  const y = Math.random() * (window.innerHeight - 50);
  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  snoopy.style.display = "block";
});
</script>

</body>
</html>
